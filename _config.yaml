# site properties and page defaults
title: JOUNG LAB
subtitle: 
description: We are a biomedical informatics lab at CHA University, integrating multi-omics data and machine learning to decode molecular heterogeneity in cancer and stem cells, and translating these insights into biomarkers for precision medicine and cell therapy.
header: images/background_aidna.jpg
footer: images/background.jpg
proofer: false

# site social media and other links
links:
  email: jgjoung@cha.ac.kr
  orcid: 0000-0003-2859-1036
  google-scholar: r1h1AagAAAAJ
  github: jounglab
  twitter: jounglab
  youtube: jounglab

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff

# configure jekyll spaceship
jekyll-spaceship:
  mathjax-processor:
    src:
      - https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
